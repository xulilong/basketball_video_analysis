name: mt-basketball
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      BASKETBALL_PUBLIC_ORIGIN: https://${SITE_HOST:?Set SITE_HOST in .env}
      BASKETBALL_DATA_DIR: /app/.local-run/workbench
    volumes:
      - workbench:/app/.local-run/workbench
      - ./.local-run/models:/app/.local-run/models:ro
    # No host port: every external request must go through the protected proxy.
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env}
      TRIAL_PASSWORD_HASH: ${TRIAL_PASSWORD_HASH:?Set TRIAL_PASSWORD_HASH in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  workbench:
  caddy_data:
  caddy_config:
