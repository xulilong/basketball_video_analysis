plugins { id 'com.android.application' }
android {
    namespace 'com.courtmoments.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.courtmoments.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.2'
        def endpoint = providers.gradleProperty('serverUrl').getOrElse('')
        if (endpoint && !endpoint.matches('https://[a-zA-Z0-9.-]+(:[0-9]+)?')) throw new GradleException('serverUrl must be an HTTPS origin')
        buildConfigField 'String', 'DEFAULT_SERVER', '"' + endpoint + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'com.google.zxing:core:3.5.3' }
