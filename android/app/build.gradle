plugins { id 'com.android.application' }
android {
    namespace 'com.magictavern.basketball'
    compileSdk 35
    defaultConfig {
        applicationId 'com.magictavern.basketball'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        def endpoint = providers.gradleProperty('mtServerUrl').getOrElse('')
        if (endpoint && !endpoint.matches('https://[a-zA-Z0-9.-]+(:[0-9]+)?')) throw new GradleException('mtServerUrl must be an HTTPS origin')
        buildConfigField 'String', 'DEFAULT_SERVER', '"' + endpoint + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.15.0' }
